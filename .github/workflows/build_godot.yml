name: "Build Godot Game"
on: push

jobs:

  export-web:
    name: Web Export
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: JSON to variables
        uses: rgarcia-phi/json-to-variables@v1.1.0
        with:
          filename: 'project.json'
          masked: false
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${json_godot_version}.stable ~/.local/share/godot/export_templates/${json_godot_version}.stable
      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
          cp ../GODOT_LICENSE.txt $EXPORT_DIR/web/GODOT_LICENSE.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web