name: "Build Godot Game"
on: push

jobs:

  export-web:
    name: Web Export
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
      - run: node .github/workflows/get_json_as_env.mjs
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${json_godot_version}.stable ~/.local/share/godot/export_templates/${json_godot_version}.stable
      - name: Build
        run: |
          mkdir -v -p "build/web"
          EXPORT_DIR="$(readlink -f build/web)"
          cd $json_project_path
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/index.html"
          cp ../GODOT_LICENSE.txt $EXPORT_DIR/GODOT_LICENSE.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.json_export_name }}_${{ env.json_version }}_${{ github.run_number }}_web
          path: build/web